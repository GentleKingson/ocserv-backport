---
name: ubuntu-noble-build

"on":
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  ubuntu-noble-build:
    name: ubuntu-noble-build-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      TARGET_ARCH: ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v7

      - name: Ensure enough runner disk space
        run: scripts/ci-ensure-disk-space.sh

      - name: Build and test Ubuntu Noble packages
        run: |
          set -euo pipefail
          sudo --preserve-env=TARGET_ARCH \
            ./scripts/noble-auto-build.sh --provision --yes

      - name: Stage Ubuntu Noble artifacts
        if: success()
        run: |
          scripts/ci-stage-build-artifacts.sh \
            "build/ubuntu/noble/${TARGET_ARCH}" \
            "${RUNNER_TEMP}/ubuntu-noble-artifacts"

      - name: Upload Ubuntu Noble artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-noble-build-${{ matrix.arch }}
          if-no-files-found: error
          path: ${{ runner.temp }}/ubuntu-noble-artifacts/**

      - name: Prepare Ubuntu Noble build logs
        if: always()
        run: |
          scripts/ci-prepare-build-logs.sh \
            "build/ubuntu/noble" \
            "${RUNNER_TEMP}/ubuntu-noble-upload-logs"

      - name: Upload Ubuntu Noble build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-noble-build-logs-${{ matrix.arch }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/ubuntu-noble-upload-logs/**
