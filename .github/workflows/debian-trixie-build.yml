---
name: debian-trixie-build

"on":
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  debian-trixie-build:
    name: debian-trixie-build-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      TARGET_ARCH: ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v7

      - name: Ensure enough runner disk space
        run: scripts/ci-ensure-disk-space.sh

      - name: Build and test Debian Trixie packages
        run: |
          set -euo pipefail
          sudo --preserve-env=TARGET_ARCH \
            ./scripts/trixie-auto-build.sh --provision --yes

      - name: Stage Debian Trixie artifacts
        if: success()
        run: |
          scripts/ci-stage-build-artifacts.sh \
            "build/debian/trixie/${TARGET_ARCH}" \
            "${RUNNER_TEMP}/debian-trixie-artifacts"

      - name: Upload Debian Trixie artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: debian-trixie-build-${{ matrix.arch }}
          if-no-files-found: error
          path: ${{ runner.temp }}/debian-trixie-artifacts/**

      - name: Prepare Debian Trixie build logs
        if: always()
        run: |
          scripts/ci-prepare-build-logs.sh \
            "build/debian/trixie" \
            "${RUNNER_TEMP}/debian-trixie-upload-logs"

      - name: Upload Debian Trixie build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debian-trixie-build-logs-${{ matrix.arch }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/debian-trixie-upload-logs/**
