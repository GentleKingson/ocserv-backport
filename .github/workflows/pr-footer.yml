---
name: pr-footer

# Strip the Claude Code attribution block that cloud sessions append to pull
# request bodies. The body is edited with GITHUB_TOKEN, which does not start
# another run, so the edit does not loop.
"on":
  pull_request_target:
    types: [opened, edited]

permissions:
  contents: read

concurrency:
  group: pr-footer-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  strip:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # pull_request_target checks out the base branch, never the PR head.
      - uses: actions/checkout@v7

      - name: Remove the Claude Code footer from the body
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          body_file="${RUNNER_TEMP}/pr-body.txt"
          stripped_file="${RUNNER_TEMP}/pr-body-stripped.txt"
          jq -r '.pull_request.body // ""' "${GITHUB_EVENT_PATH}" \
            > "${body_file}"
          scripts/strip-pr-footer.sh < "${body_file}" > "${stripped_file}"
          if cmp -s "${body_file}" "${stripped_file}"; then
            echo "No footer to remove."
            exit 0
          fi
          jq -Rs '{body: sub("\n$"; "")}' < "${stripped_file}" \
            | gh api --method PATCH \
                "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
                --input - > /dev/null
          echo "Removed the Claude Code footer from #${PR_NUMBER}."
