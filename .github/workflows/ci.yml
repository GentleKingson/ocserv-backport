---
name: ci

"on":
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'test/**'
      - 'source-lock/**'
      - 'docs/**'
      - 'Makefile'
      - 'README.md'
      - '.shellcheckrc'
      - '.github/**'
  pull_request:
    paths:
      - 'scripts/**'
      - 'test/**'
      - 'source-lock/**'
      - 'docs/**'
      - 'Makefile'
      - 'README.md'
      - '.shellcheckrc'
      - '.github/**'
  workflow_dispatch:
    inputs:
      target:
        description: CI target to run
        required: true
        default: checks
        type: choice
        options:
          - checks
          - source-package
          - all
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: >-
    ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    if: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'pull_request' ||
        (
          github.event_name == 'workflow_dispatch' &&
          (inputs.target == 'checks' || inputs.target == 'all')
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bats \
            python3-pyflakes \
            python3-yaml \
            shellcheck \
            yamllint

      - name: Bash syntax
        run: |
          find scripts -type f \( -name '*.sh' -o ! -name '*.*' \) -print0 \
            | xargs -0 -r bash -n

      - name: ShellCheck
        run: |
          find scripts -type f \( -name '*.sh' -o ! -name '*.*' \) -print0 \
            | xargs -0 -r shellcheck -x

      - name: Python syntax
        run: python3 -m compileall scripts test

      - name: Python lint
        run: python3 -m pyflakes scripts/*.py

      - name: YAML lint
        run: yamllint .github source-lock

      - name: Verify source lock projection
        run: make trixie-verify-locks

      - name: Unit tests
        run: make test

  source-package:
    name: source-package (${{ matrix.suite }})
    if: >-
      ${{
        github.event_name == 'schedule' ||
        (
          github.event_name == 'workflow_dispatch' &&
          (inputs.target == 'source-package' || inputs.target == 'all')
        )
      }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: trixie
            image: debian:trixie
            target: trixie-source-ci
          - suite: noble
            image: ubuntu:24.04
            target: noble-source-ci
          - suite: resolute
            image: ubuntu:26.04
            target: resolute-source-ci
    env:
      TARGET_ARCH: amd64
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Install checkout dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git

      - uses: actions/checkout@v7

      - name: Install source package dependencies
        run: |
          apt-get install -y --no-install-recommends \
            bash \
            build-essential \
            curl \
            debhelper \
            debian-archive-keyring \
            devscripts \
            dpkg-dev \
            fakeroot \
            gnupg \
            make \
            python3 \
            python3-yaml \
            xz-utils

      - name: Refresh Debian source verification keyrings
        run: |
          scripts/ci-debian-keyrings.sh "${RUNNER_TEMP}/debian-keyrings" \
            >> "${GITHUB_ENV}"

      - name: Build ${{ matrix.suite }} source package
        run: make ${{ matrix.target }}
